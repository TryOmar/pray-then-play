name: 🚀 Build & Release Cross-Platform Binaries

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =====================================================================
  # 1. ANDROID BUILD JOB (APK & AAB)
  # =====================================================================
  build-android:
    name: 📱 Build Android (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🎯 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔑 Configure Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "storeFile=upload-keystore.jks" > android/key.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "✅ Release signing key configured from repository secrets."
          elif [ -f "android/app/upload-keystore.jks" ]; then
            echo "storeFile=upload-keystore.jks" > android/key.properties
            echo "storePassword=ptppassword2026" >> android/key.properties
            echo "keyAlias=upload" >> android/key.properties
            echo "keyPassword=ptppassword2026" >> android/key.properties
            echo "✅ Release signing configured from local keystore."
          else
            echo "ℹ️ Generating CI release signing keystore..."
            keytool -genkeypair -v -keystore android/app/upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass ptppassword2026 -keypass ptppassword2026 -dname "CN=PrayThenPlay, OU=Dev, O=PTP, L=Cairo, S=Cairo, C=EG"
            echo "storeFile=upload-keystore.jks" > android/key.properties
            echo "storePassword=ptppassword2026" >> android/key.properties
            echo "keyAlias=upload" >> android/key.properties
            echo "keyPassword=ptppassword2026" >> android/key.properties
            echo "✅ CI release keystore generated successfully."
          fi

      - name: 🏗️ Build Android App Bundle (AAB for Google Play)
        run: flutter build appbundle --release

      - name: 🏗️ Build Android Universal APK
        run: flutter build apk --release

      - name: 🏷️ Rename Release Artifacts
        run: |
          mkdir -p dist/android
          cp build/app/outputs/bundle/release/app-release.aab dist/android/PrayThenPlay-v2.0.0-release.aab
          cp build/app/outputs/flutter-apk/app-release.apk dist/android/PrayThenPlay-v2.0.0-universal.apk

      - name: 📤 Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-binaries
          path: dist/android/*
          if-no-files-found: error

  # =====================================================================
  # 2. WINDOWS BUILD JOB (Standalone .exe & Inno Setup Installer)
  # =====================================================================
  build-windows:
    name: 🪟 Build Windows (Installer & Portable)
    runs-on: windows-latest
    env:
      _CL_: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
      CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🎯 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: ⚙️ Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🏗️ Build Windows Release
        run: flutter build windows --release

      - name: 🛠️ Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 📦 Compile Inno Setup Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build/windows/installer"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/setup.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compilation failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: 🗜️ Package Portable Windows Zip Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\windows\installer\PrayThenPlay-Portable-v2.0.0-windows-x64.zip" -Force

      - name: 📤 Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-binaries
          path: build/windows/installer/*
          if-no-files-found: error

  # =====================================================================
  # 3. WEB CLIENT BUILD JOB (Flutter Web)
  # =====================================================================
  build-web:
    name: 🌐 Build Flutter Web Client
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🎯 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🏗️ Build Web Application
        run: flutter build web --release --base-href /app/

      - name: 🗜️ Package Web Bundle
        run: |
          mkdir -p dist/web
          cd build/web && zip -r ../../dist/web/pray-then-play-web-bundle.zip .

      - name: 📤 Upload Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-release-bundle
          path: |
            build/web/
            dist/web/*
          if-no-files-found: error

  # =====================================================================
  # 4. GITHUB RELEASES AUTOMATION (Triggers on git tag v*)
  # =====================================================================
  publish-release:
    name: 🏷️ Publish GitHub Release
    needs: [build-android, build-windows, build-web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-binaries
          path: release-assets/

      - name: 📥 Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-binaries
          path: release-assets/

      - name: 📥 Download Web Bundle
        uses: actions/download-artifact@v4
        with:
          name: web-release-bundle
          path: release-assets/

      - name: 🚀 Publish GitHub Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: Pray Then Play ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎮 Pray Then Play — Official Release ${{ github.ref_name }}

            ### 📦 Download Packages
            | Platform | File | Description |
            | :--- | :--- | :--- |
            | **Android** | `PrayThenPlay-v2.0.0-universal.apk` | Universal APK for sideloading on Android 8.0+ |
            | **Google Play** | `PrayThenPlay-v2.0.0-release.aab` | Google Play App Bundle for Play Store console |
            | **Windows (Setup)** | `PrayThenPlay-Setup-v2.0.0-x64.exe` | 1-Click Windows installer with auto-startup & tray |
            | **Windows (Portable)** | `PrayThenPlay-Portable-v2.0.0-windows-x64.zip` | Standalone portable executable |
            | **Web App** | `pray-then-play-web-bundle.zip` | Deployable static bundle for web hosting |

            ---
            *Salah first. Gaming second. Stay on time. Play with peace of mind.*
