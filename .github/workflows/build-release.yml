name: Build & Release Cross-Platform Binaries

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =====================================================================
  # 1. ANDROID BUILD JOB (APK & AAB)
  # =====================================================================
  build-android:
    name: Build Android Binaries (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "storeFile=upload-keystore.jks" > android/key.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "Release signing key configured from repository secrets."
          elif [ -f "android/app/upload-keystore.jks" ]; then
            echo "storeFile=upload-keystore.jks" > android/key.properties
            echo "storePassword=ptppassword2026" >> android/key.properties
            echo "keyAlias=upload" >> android/key.properties
            echo "keyPassword=ptppassword2026" >> android/key.properties
            echo "Release signing configured from local keystore."
          else
            echo "Generating CI release signing keystore..."
            keytool -genkeypair -v -keystore android/app/upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass ptppassword2026 -keypass ptppassword2026 -dname "CN=PrayThenPlay, OU=Dev, O=PTP, L=Cairo, S=Cairo, C=EG"
            echo "storeFile=upload-keystore.jks" > android/key.properties
            echo "storePassword=ptppassword2026" >> android/key.properties
            echo "keyAlias=upload" >> android/key.properties
            echo "keyPassword=ptppassword2026" >> android/key.properties
            echo "CI release keystore generated successfully."
          fi

      - name: Build Android App Bundle (AAB for Google Play)
        run: flutter build appbundle --release

      - name: Build Android Universal APK
        run: flutter build apk --release

      - name: Rename release binaries
        run: |
          mkdir -p dist/android
          cp build/app/outputs/bundle/release/app-release.aab dist/android/PrayThenPlay-v2.0.0-release.aab
          cp build/app/outputs/flutter-apk/app-release.apk dist/android/PrayThenPlay-v2.0.0-universal.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-binaries
          path: dist/android/*
          if-no-files-found: error

  # =====================================================================
  # 2. WINDOWS BUILD JOB (Standalone .exe & Inno Setup Installer)
  # =====================================================================
  build-windows:
    name: Build Windows Binaries (Setup & Portable)
    runs-on: windows-latest
    env:
      _CL_: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
      CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup compiler
        run: choco install innosetup --no-progress -y

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build/windows/installer"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/setup.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compilation failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Package portable Windows zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\windows\installer\PrayThenPlay-Portable-v2.0.0-windows-x64.zip" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-binaries
          path: build/windows/installer/*
          if-no-files-found: error

  # =====================================================================
  # 3. WEB CLIENT BUILD JOB (Flutter Web)
  # =====================================================================
  build-web:
    name: Build Flutter Web Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web application
        run: flutter build web --release --base-href "/pray-then-play-website/app/"

      - name: Package web release bundle
        run: |
          mkdir -p dist/web
          cd build/web && zip -r ../../dist/web/pray-then-play-web-bundle.zip .

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release-bundle
          path: dist/web/pray-then-play-web-bundle.zip
          if-no-files-found: error

  # =====================================================================
  # 4. GITHUB RELEASES AUTOMATION (Triggers on git tag v*)
  # =====================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows, build-web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-binaries
          path: release-assets/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-binaries
          path: release-assets/

      - name: Download web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-release-bundle
          path: release-assets/

      - name: Publish GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: Pray Then Play ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            <div align="center">

            # Pray Then Play — Official Release ${{ github.ref_name }}

            ### *Salah first. Gaming second. Stay on time. Play with peace of mind.*

            [![Launch Web Companion](https://img.shields.io/badge/Launch_Live_Web_App-00E676?style=for-the-badge&logo=googlechrome&logoColor=black)](https://tryomar.github.io/pray-then-play-website/app/)
            [![Official Showcase](https://img.shields.io/badge/Official_Showcase_Portal-070B14?style=for-the-badge&logo=safari&logoColor=white)](https://tryomar.github.io/pray-then-play-website/)

            </div>

            ---

            ### Web Access
            > **Try Pray Then Play directly in your browser without installation:**
            > [Launch Live Web Companion](https://tryomar.github.io/pray-then-play-website/app/)

            ---

            ### Download Packages

            | Platform | File | Target Audience & Instructions |
            | :--- | :--- | :--- |
            | Android | `PrayThenPlay-v2.0.0-universal.apk` | Direct 1-tap download & install on Android 8.0+. |
            | Windows (Installer) | `PrayThenPlay-Setup-v2.0.0-x64.exe` | 1-Click setup with system tray integration and autostart. |
            | Windows (Portable) | `PrayThenPlay-Portable-v2.0.0-windows-x64.zip` | Standalone portable executable. Extract and run anywhere. |
            | Self-Hosted Web | `pray-then-play-web-bundle.zip` | Complete compiled web bundle for self-hosting on Nginx/Docker. |
            | Google Play Console | `PrayThenPlay-v2.0.0-release.aab` | *(For Developers)* Google Play App Bundle for Play Console publishing. |

            ---

            ### Release Highlights
            * **Queue Check Decision Engine**: Deterministic calculations balancing match durations against prayer windows.
            * **Global Prayer Calculations**: 11 astronomical calculation methods with custom buffer protection.
            * **11-Theme Lighting Matrix**: Cyber Midnight, Crimson Fury, Emerald Calm, Solar Amber, and OLED Black.
            * **10 Supported Languages**: English, Arabic, Urdu, Turkish, French, German, Spanish, Indonesian, Malay, Russian.
            * **100% Offline-First Privacy**: Zero tracking, zero telemetry, local encrypted storage.

            ---
            *Engineered with precision for Muslim gamers worldwide.*

      - name: Trigger website deployment
        env:
          GITHUB_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering live website redeployment on TryOmar/pray-then-play-website..."
          curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/TryOmar/pray-then-play-website/dispatches \
            -d '{"event_type":"release-published"}' || true
          echo "Deployment signal dispatched."
