<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pray Then Play - Islamic Prayer Times & Gaming Safety Companion">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pray Then Play">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pray Then Play</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0B1020;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
    }
    .loading-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .loading-spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(56, 189, 248, 0.15);
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: ptp-spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .loading-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #94A3B8;
    }
    @keyframes ptp-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-wrapper">
    <div class="loading-spinner"></div>
    <div class="loading-title">Pray Then Play</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
