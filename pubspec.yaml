name: pray_then_play
description: "Pray Then Play - Stay on time. Play with peace of mind. A gaming companion for Muslim gamers."
publish_to: 'none'
version: 2.0.1+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  
  # Prayer Times
  adhan: ^2.0.0-nullsafety.0
  
  # Location
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  permission_handler: ^11.3.1
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  
  # Routing
  go_router: ^14.3.0
  
  # Storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  percent_indicator: ^4.2.3
  fl_chart: ^0.70.2
  
  # Utilities
  intl: ^0.20.1
  uuid: ^4.5.1
  home_widget: ^0.7.0
  http: ^1.2.2
  url_launcher: ^6.3.0

  # Desktop & Windows Platform Support
  window_manager: ^0.4.3
  tray_manager: ^0.2.4
  local_notifier: ^0.1.6
  launch_at_startup: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/branding/
    - assets/branding/icon/
    - assets/branding/logo/
    - assets/branding/logo/themes/

dependency_overrides:
  path_provider_android: 2.2.17

